<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="ringBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="ringEmerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="ringAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bgGrad)" stroke="#333333" stroke-width="16"/>
  <!-- Outer Sunburst / Hub Arcs -->
  <circle cx="512" cy="512" r="310" fill="none" stroke="#282828" stroke-width="56"/>
  <path d="M 512 202 A 310 310 0 0 1 822 512" fill="none" stroke="url(#ringEmerald)" stroke-width="56" stroke-linecap="round"/>
  <path d="M 822 512 A 310 310 0 0 1 310 747" fill="none" stroke="url(#ringBlue)" stroke-width="56" stroke-linecap="round"/>
  <path d="M 225 395 A 310 310 0 0 1 420 216" fill="none" stroke="url(#ringAmber)" stroke-width="56" stroke-linecap="round"/>
  <!-- Inner Ring -->
  <circle cx="512" cy="512" r="200" fill="none" stroke="#2A2A2A" stroke-width="38"/>
  <path d="M 512 312 A 200 200 0 1 1 325 582" fill="none" stroke="#3B82F6" stroke-opacity="0.85" stroke-width="38" stroke-linecap="round"/>
  <!-- Center Core Hub -->
  <circle cx="512" cy="512" r="96" fill="#1C1C1C" stroke="#3E3E3E" stroke-width="12"/>
  <circle cx="512" cy="512" r="36" fill="#10B981"/>
</svg>

